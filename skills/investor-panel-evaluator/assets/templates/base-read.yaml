# Base read: the single business judgement for one startup. Spec: references/dimensions.md.
# Every dimension starts as Unknown with empty buckets. Raise a rating only when ledger evidence allows it
# (evidence ceiling), then run:
#   startup-kit shark-tank base-read base-read.yaml --profile ../startup-profile --out base-read.md
# Buckets: verified = status verified; reported = status reported (label founder-sourced figures
# "founder-provided"); estimate; assumption; disputed = unverified or contradicted; unknowns = open
# questions as text, never E-IDs. Write [] for an empty bucket; never delete a bucket.
startup: "<startup-slug>"           # a slug only, as in outputs/<startup>/
# note: "<optional free text, for example: Fictional company for the tracked example; all figures invented.>"
#   Use note for anything a reader must know about the base read as a whole (fictional data, a provisional
#   type such as regulated, a market taken from the ledger). Never put evidence or ratings
#   in it.
as_of: "<YYYY-MM-DD>"
ledger_snapshot: "<YYYY-MM-DD>"      # latest `updated` date in evidence.yaml when this read was made
business_type: ["<saas | hardware | consumer-goods | services | marketplace | d2c | regulated>"]   # primary, optional secondary
stage: "<pre-launch | launched-pre-revenue | early-revenue | trading | scaling>"
ambition: unknown                    # venture | growth | lifestyle | unknown (as the founder states it)
# imported_from: outputs/<startup>/startup-analysis/<startup>-evaluation.md   # only if an evaluator report exists
# imported_date: "<YYYY-MM-DD>"
dimensions:
  D01:                                # Problem severity
    rating: unknown                  # strong | adequate | weak | unknown
    confidence: low                  # high | medium | low
    critical: true                    # from references/business-types-and-stages.md
    explanation: "<Two to four sentences: what the evidence shows, and why this level and not the one above or below.>"
    evidence: {verified: [], reported: [], estimate: [], assumption: [], disputed: [], unknowns: ["<decisive question for D01>"]}
    ceiling: unknown
    upgrade_if: "<checkable evidence that would raise the rating>"
    downgrade_if: "<checkable evidence that would lower the rating>"
    divergence_note: null            # required where the crosswalk says so; name the report, its date, both ratings, ledger IDs
